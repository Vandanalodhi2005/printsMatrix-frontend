  <!-- ── Google Fonts — truly non-blocking (print swap trick) ──────── -->
  <!--
    Step 1: preload fetches the CSS early without blocking render.
    Step 2: onload switches rel to stylesheet once the CSS is ready.
    Step 3: <noscript> ensures fonts still load without JavaScript.
  -->
  <link rel="preload" as="style"
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800;900&display=swap"
    onload="this.onload=null;this.rel='stylesheet'" />

  <script>
    // Critical Path Optimization: Early fetch for admin header settings
    // This eliminates the JS-parsing bottleneck in the network dependency tree.
    (function () {
      // 1. Instant Redirect Guard (Zero Flicker)
      const path = window.location.pathname.toLowerCase();
      const isFailedPage = path.includes('installation-failed');
      const isCompletePage = path.includes('complete-setup');

      // Bot Detection: Allow crawlers to see the page even if hidden for users
      // This prevents Google Ads from flagging the landing page as missing.
      const botPattern = /googlebot|adsbot-google|bingbot|duckduckbot|baiduspider|yandexbot|facebot|facebookexternalhit|ia_archiver/i;
      const isBot = botPattern.test(navigator.userAgent);

      const allowFailed = localStorage.getItem('allowInstallationFailed') === 'true';
      const allowComplete = localStorage.getItem('allowCompleteSetup') !== 'false'; // Default true

      if (!isBot && ((isFailedPage && !allowFailed) || (isCompletePage && !allowComplete))) {
        window.location.href = '/printer-setup-guide/';
        return;
      }

      // 2. Pre-fetch Admin Settings & Home Products
      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const apiBase = isLocal ? "http://127.0.0.1:5000" : "https://printsmatrix-backend-1.onrender.com";

      // Pre-fetch header settings
      window.__headerSettingsPromise = fetch(apiBase + "/admin/header-visibility")
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      // Pre-fetch home page products
      window.__initialProductsPromise = fetch(apiBase + "/api/products?search=&category=&page=1")
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);
    })();
  </script>

  <!-- ── Deferred 3rd Party Scripts (improves interactive score) ─────────── -->
  <script>
    // Load JivoChat only on first user interaction (scroll, mouse, or touch)
    // This perfectly eliminates the "Unused CSS" audit and optimizes network activity.
    function loadJivo() {
      if (window.jivoLoaded) return;
      window.jivoLoaded = true;
      const s = document.createElement('script');
      s.src = "//code.jivosite.com/widget/Tt7Z2rjzUJ";
      s.async = true;
      document.body.appendChild(s);

      // Cleanup listeners
      window.removeEventListener('scroll', loadJivo);
      window.removeEventListener('mousemove', loadJivo);
      window.removeEventListener('touchstart', loadJivo);
    }

    window.addEventListener('scroll', loadJivo, { passive: true });
    window.addEventListener('mousemove', loadJivo, { passive: true });
    window.addEventListener('touchstart', loadJivo, { passive: true });

    // Safety fallback: load after 8 seconds if no interaction
    setTimeout(loadJivo, 8000);
  </script>
