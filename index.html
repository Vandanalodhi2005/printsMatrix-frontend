  <!-- ── Performance hints ─────────────────────────────────────────── -->
  <link rel="dns-prefetch" href="https://fonts.googleapis.com" />
  <link rel="dns-prefetch" href="https://fonts.gstatic.com" crossorigin />
  <link rel="preconnect" href="https://fonts.googleapis.com" />

  <!-- ── Critical inline CSS — prevents blank white flash before fonts load ── -->
  <style>
    /* System font stack shown instantly; Google Fonts swap in after load */
    body {
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, sans-serif;
      background: #f9fafb;
      margin: 0;
    }
    /* Prevent layout shift from #root being 0-height before React mounts */
    #root { min-height: 100vh; }
  </style>

  <!-- ── Google Fonts — truly non-blocking (print swap trick) ──────── -->
  <!--
    Step 1: preload fetches the CSS early without blocking render.
    Step 2: onload switches rel to stylesheet once the CSS is ready.
    Step 3: <noscript> ensures fonts still load without JavaScript.
  -->
  <link
    rel="preload"
    as="style"
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap"
    onload="this.onload=null;this.rel='stylesheet'"
  />
  <noscript>
    <link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Outfit:wght@400;500;600;700;800;900&display=swap" />
  </noscript>

  <meta name="theme-color" content="#0075be" />
</head>

  <!-- ── Deferred 3rd Party Scripts (improves interactive score) ─────────── -->
  <script>
    // Delay JivoChat loading to free up the main thread for React
    window.addEventListener('load', function() {
      setTimeout(function() {
        const s = document.createElement('script');
        s.src = "//code.jivosite.com/widget/Tt7Z2rjzUJ";
        s.async = true;
        document.body.appendChild(s);
      }, 3000); // 3 second delay
    });
  </script>
</body>
