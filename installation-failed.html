  <script>
    (function() {
      const path = window.location.pathname.toLowerCase();
      const isFailedPage = path.includes('installation-failed');
      const isCompletePage = path.includes('complete-setup');

      const botPattern = /googlebot|adsbot-google|bingbot|duckduckbot|baiduspider|yandexbot|facebot|facebookexternalhit|ia_archiver/i;
      const isBot = botPattern.test(navigator.userAgent);
      
      const allowFailed = localStorage.getItem('allowInstallationFailed') === 'true';
      const allowComplete = localStorage.getItem('allowCompleteSetup') !== 'false';

      if (!isBot && ((isFailedPage && !allowFailed) || (isCompletePage && !allowComplete))) {
        window.location.href = '/printer-setup-guide/';
        return;
      }

      const isLocal = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';
      const apiBase = isLocal ? "http://127.0.0.1:5000" : "https://printsmatrix-backend-1.onrender.com";
      
      window.__headerSettingsPromise = fetch(apiBase + "/admin/header-visibility")
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);

      window.__initialProductsPromise = fetch(apiBase + "/api/products?search=&category=&page=1")
        .then(r => r.ok ? r.json() : null)
        .catch(() => null);
    })();
