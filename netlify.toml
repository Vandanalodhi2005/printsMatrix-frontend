[build]
  # Root is the frontend directory (since this file lives there)
  publish = "dist"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback: serve index.html for every path that isn't a real file
# This prevents the MIME type error caused by Netlify returning HTML for JS requests
[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

# Long-term cache for hashed JS/CSS assets (safe: hash changes on every deploy)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# No-cache for index.html so users always get the latest deploy
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Security headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection       = "1; mode=block"
    Referrer-Policy        = "same-origin"
